name: Build APK & Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Salin aplikasi web ke aset APK
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web
          cp -r web android/app/src/main/assets/web
          rm -f android/app/src/main/assets/web/sw.js

      - name: Build APK (rilis, bertanda tangan)
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KLM-Cut.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KLM-Cut-apk
          path: KLM-Cut.apk

      - name: Rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: KLM Cut v1.1.${{ github.run_number }}
          body: |
            Pasang `KLM-Cut.apk` di Android (izinkan "install dari sumber tidak dikenal").
            Versi web/PWA: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: KLM-Cut.apk

  pages:
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
